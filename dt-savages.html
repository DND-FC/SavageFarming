fer","kind":"gear","slots":["ring1","ring2"],"quantityPerClear":1}]},{"id":"m10s","label":"M10S","name":"AAC Heavyweight M2 (Savage)","book":"AAC Illustrated: HW Edition II","awards":[{"id":"head","label":"Head gear coffer","kind":"gear","slots":["head"],"quantityPerClear":1},{"id":"gloves","label":"Hand gear coffer","kind":"gear","slots":["gloves"],"quantityPerClear":1},{"id":"feet","label":"Foot gear coffer","kind":"gear","slots":["feet"],"quantityPerClear":1},{"id":"glaze","label":"Thundersteeping Glaze","kind":"upgrade","upgrade":"glaze","quantityPerClear":1}]},{"id":"m11s","label":"M11S","name":"AAC Heavyweight M3 (Savage)","book":"AAC Illustrated: HW Edition III","awards":[{"id":"chest","label":"Chest gear coffer","kind":"gear","slots":["chest"],"quantityPerClear":1},{"id":"legs","label":"Leg gear coffer","kind":"gear","slots":["legs"],"quantityPerClear":1},{"id":"twine","label":"Thundersteeped Twine","kind":"upgrade","upgrade":"twine","quantityPerClear":1},{"id":"solvent","label":"Thundersteeped Solvent","kind":"upgrade","upgrade":"solvent","quantityPerClear":1}]}]};</script>
  <script type="module">function blankPlayer(config) {
  return {
    needs: Object.fromEntries(config.slots.map((slot) => [slot.id, "none"])),
    complete: Object.fromEntries(config.slots.map((slot) => [slot.id, false])),
    books: Object.fromEntries(config.raids.map((raid) => [raid.id, 0])),
    upgrades: Object.fromEntries(config.upgrades.map((upgrade) => [upgrade.id, 0]))
  };
}

function blankState(config) {
  return { v: 1, players: Object.fromEntries(config.players.map((name) => [name, blankPlayer(config)])), runs: [] };
}

function normalizeState(config, candidate) {
  const clean = blankState(config);
  if (!candidate || candidate.v !== 1 || typeof candidate.players !== "object") return clean;
  for (const name of config.players) {
    const input = candidate.players[name];
    if (!input) continue;
    for (const slot of config.slots) {
      if (["none", "augmented", "raid"].includes(input.needs?.[slot.id])) clean.players[name].needs[slot.id] = input.needs[slot.id];
      clean.players[name].complete[slot.id] = Boolean(input.complete?.[slot.id]);
    }
    for (const raid of config.raids) clean.players[name].books[raid.id] = safeCount(input.books?.[raid.id]);
    for (const upgrade of config.upgrades) clean.players[name].upgrades[upgrade.id] = safeCount(input.upgrades?.[upgrade.id]);
  }
  clean.runs = Array.isArray(candidate.runs) ? candidate.runs.slice(-100).filter((run) => run && typeof run === "object") : [];
  return clean;
}

function safeCount(value) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.max(0, Math.min(999, Math.trunc(number))) : 0;
}

function remainingNeeds(config, state, raidId) {
  const results = [];
  for (const name of config.players) {
    const player = state.players[name];
    const availableUpgrades = { ...player.upgrades };
    for (const slot of config.slots) {
      const target = player.needs[slot.id];
      if (target === "none" || player.complete[slot.id]) continue;
      if (target === "raid" && slot.raid === raidId) {
        const raid = config.raids.find((item) => item.id === raidId);
        const award = raid?.awards.find((item) => item.kind === "gear" && (!item.slots || item.slots.includes(slot.id)));
        results.push({ player: name, slot, target, reward: award?.id ?? "gear", bookCost: slot.bookCost });
      }
      if (target === "augmented") {
        const upgrade = config.upgrades.find((item) => item.id === slot.upgrade);
        if (upgrade?.raid !== raidId) continue;
        if ((availableUpgrades[upgrade.id] ?? 0) > 0) {
          availableUpgrades[upgrade.id] -= 1;
          continue;
        }
        results.push({ player: name, slot, target, reward: upgrade.id, bookCost: upgrade.bookCost });
      }
    }
  }
  return results;
}

function optionVectors(needs, books) {
  const vectors = [];
  const visit = (index, spent, drops) => {
    if (spent > books) return;
    if (index === needs.length) {
      vectors.push(drops);
      return;
    }
    const need = needs[index];
    visit(index + 1, spent + need.bookCost, drops);
    visit(index + 1, spent, { ...drops, [need.reward]: (drops[need.reward] ?? 0) + 1 });
  };
  visit(0, 0, {});
  return vectors;
}

function feasibleAfterClears(config, state, raid, clears) {
  const capacity = Object.fromEntries(raid.awards.map((award) => [award.id, award.quantityPerClear * clears]));
  const byPlayer = new Map(config.players.map((name) => [name, []]));
  for (const need of remainingNeeds(config, state, raid.id)) byPlayer.get(need.player).push(need);
  let totals = [{}];
  for (const name of config.players) {
    const options = optionVectors(byPlayer.get(name), state.players[name].books[raid.id] + clears);
    const next = [];
    for (const total of totals) {
      for (const option of options) {
        const merged = { ...total };
        let valid = true;
        for (const [reward, count] of Object.entries(option)) {
          merged[reward] = (merged[reward] ?? 0) + count;
          if (merged[reward] > (capacity[reward] ?? 0)) { valid = false; break; }
        }
        if (valid) next.push(merged);
      }
    }
    if (!next.length) return false;
    totals = [...new Map(next.map((vector) => [Object.entries(vector).sort().map(([key, value]) => `${key}:${value}`).join("|"), vector])).values()];
  }
  return totals.length > 0;
}

function runsRemaining(config, state, raidId) {
  const raid = config.raids.find((item) => item.id === raidId);
  if (!raid) return 0;
  if (!remainingNeeds(config, state, raidId).length) return 0;
  for (let clears = 0; clears <= 200; clears += 1) {
    if (feasibleAfterClears(config, state, raid, clears)) return clears;
  }
  return Infinity;
}

function acquireWithBooks(config, state, playerName, slotId) {
  const player = state.players[playerName];
  const slot = config.slots.find((item) => item.id === slotId);
  if (!player || !slot || player.complete[slotId] || player.needs[slotId] === "none") return false;
  const target = player.needs[slotId];
  const resource = target === "raid" ? slot : config.upgrades.find((item) => item.id === slot.upgrade);
  if (!resource || player.books[resource.raid] < resource.bookCost) return false;
  player.books[resource.raid] -= resource.bookCost;
  player.complete[slotId] = true;
  return true;
}

function acquireWithUpgrade(config, state, playerName, slotId) {
  const player = state.players[playerName];
  const slot = config.slots.find((item) => item.id === slotId);
  if (!player || !slot || player.complete[slotId] || player.needs[slotId] !== "augmented") return false;
  if ((player.upgrades[slot.upgrade] ?? 0) < 1) return false;
  player.upgrades[slot.upgrade] -= 1;
  player.complete[slotId] = true;
  return true;
}

const esc = (value) => String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
const encode = (value) => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(value)))).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
const decode = (value) => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(value.replaceAll("-", "+").replaceAll("_", "/") + "===".slice((value.length + 3) % 4)), (character) => character.charCodeAt(0))));

function compactState(state) {
  return {
    v: 1,
    p: config.players.map((name) => {
      const player = state.players[name];
      return [
        config.slots.map((slot) => ({ none: "0", augmented: "a", raid: "r" })[player.needs[slot.id]]).join(""),
        config.slots.map((slot) => player.complete[slot.id] ? "1" : "0").join(""),
        config.raids.map((raid) => player.books[raid.id]),
        config.upgrades.map((upgrade) => player.upgrades[upgrade.id])
      ];
    }),
    r: state.runs.slice(-30)
  };
}

function expandState(payload) {
  if (!payload || payload.v !== 1 || !Array.isArray(payload.p)) return payload;
  const result = blankState(config);
  config.players.forEach((name, playerIndex) => {
    const row = payload.p[playerIndex];
    if (!Array.isArray(row)) return;
    config.slots.forEach((slot, index) => {
      result.players[name].needs[slot.id] = ({ "0": "none", a: "augmented", r: "raid" })[row[0]?.[index]] ?? "none";
      result.players[name].complete[slot.id] = row[1]?.[index] === "1";
    });
    config.raids.forEach((raid, index) => result.players[name].books[raid.id] = safeCount(row[2]?.[index]));
    config.upgrades.forEach((upgrade, index) => result.players[name].upgrades[upgrade.id] = safeCount(row[3]?.[index]));
  });
  result.runs = Array.isArray(payload.r) ? payload.r : [];
  return result;
}

function readState() {
  const match = location.hash.match(/^#s=([^&]+)/);
  if (!match) return blankState(config);
  try { return normalizeState(config, expandState(decode(match[1]))); }
  catch { return blankState(config); }
}

let state = readState();

function save() {
  history.replaceState(null, "", `#s=${encode(compactState(state))}`);
}

function notify(message) {
  const toast = document.querySelector("#toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

async function copyText(text, message) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const area = document.createElement("textarea");
    area.value = text; document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
  }
  notify(message);
}

function needCounts() {
  const result = {};
  for (const raid of config.raids) {
    const needs = remainingNeeds(config, state, raid.id);
    const bookShortfall = config.players.reduce((total, name) => {
      const personalCost = needs.filter((need) => need.player === name).reduce((sum, need) => sum + need.bookCost, 0);
      return total + Math.max(0, personalCost - state.players[name].books[raid.id]);
    }, 0);
    result[raid.id] = {
      needs,
      gear: needs.filter((need) => need.target === "raid").length,
      upgrades: Object.fromEntries(config.upgrades.map((upgrade) => [upgrade.id, needs.filter((need) => need.reward === upgrade.id).length])),
      books: bookShortfall,
      runs: runsRemaining(config, state, raid.id)
    };
  }
  return result;
}

function statCards() {
  const counts = needCounts();
  return config.raids.map((raid) => {
    const count = counts[raid.id];
    const resourceBits = [`${count.gear} gear`, `${count.books} more books if bought`];
    for (const award of raid.awards.filter((item) => item.kind === "upgrade")) resourceBits.push(`${count.upgrades[award.upgrade] ?? 0} ${award.label.replace(/^Thundersteep(?:ed|ing) /, "")}`);
    return `<article class="stat-card"><span class="eyebrow">${esc(raid.label)}</span><strong>${Number.isFinite(count.runs) ? count.runs : "—"}</strong><span>estimated clears left</span><small>${esc(resourceBits.join(" · "))}</small></article>`;
  }).join("");
}

function overview() {
  const playerSummaries = config.players.map((name) => {
    const player = state.players[name];
    const wanted = config.slots.filter((slot) => player.needs[slot.id] !== "none");
    const done = wanted.filter((slot) => player.complete[slot.id]).length;
    const remaining = wanted.filter((slot) => !player.complete[slot.id]);
    const personalNeedsByRaid = Object.fromEntries(config.raids.map((raid) => [raid.id, remainingNeeds(config, state, raid.id).filter((need) => need.player === name)]));
    const totalBits = [];
    for (const raid of config.raids) {
      const needs = personalNeedsByRaid[raid.id];
      const gearCount = needs.filter((need) => need.target === "raid").length;
      if (gearCount) totalBits.push(`<span><strong>${gearCount}</strong> ${esc(raid.label)} coffer${gearCount === 1 ? "" : "s"}</span>`);
      for (const upgrade of config.upgrades.filter((item) => item.raid === raid.id)) {
        const itemCount = needs.filter((need) => need.reward === upgrade.id).length;
        if (itemCount) totalBits.push(`<span><strong>${itemCount}</strong> ${esc(upgrade.label)}</span>`);
      }
      if (needs.length) {
        const bookShortfall = Math.max(0, needs.reduce((sum, need) => sum + need.bookCost, 0) - player.books[raid.id]);
        totalBits.push(`<span><strong>${bookShortfall}</strong> more ${esc(raid.label)} books if bought</span>`);
      }
    }
    const unconfiguredRaidNeeds = remaining.filter((slot) => player.needs[slot.id] === "raid" && !raidById[slot.raid]);
    for (const raidId of new Set(unconfiguredRaidNeeds.map((slot) => slot.raid))) {
      const count = unconfiguredRaidNeeds.filter((slot) => slot.raid === raidId).length;
      totalBits.push(`<span><strong>${count}</strong> ${esc(raidId.toUpperCase())} coffer${count === 1 ? "" : "s"}</span>`);
    }
    const outstandingAugmentedNeeds = Object.values(personalNeedsByRaid).flat().filter((need) => need.target === "augmented").length;
    const coveredByHeldItems = remaining.filter((slot) => player.needs[slot.id] === "augmented").length - outstandingAugmentedNeeds;
    if (coveredByHeldItems > 0) totalBits.push(`<span><strong>${coveredByHeldItems}</strong> ready with held item${coveredByHeldItems === 1 ? "" : "s"}</span>`);
    const resourceChips = [
      ...config.raids.map((raid) => `<span class="chip">${player.books[raid.id]} ${esc(raid.label)} books</span>`),
      ...config.upgrades.map((upgrade) => `<span class="chip">${player.upgrades[upgrade.id]} ${esc(upgrade.label.replace(/^Thundersteep(?:ed|ing) /, ""))}</span>`)
    ].join("");
    const needCards = remaining.map((slot) => {
      const target = player.needs[slot.id];
      if (target === "raid") {
        const raid = raidById[slot.raid];
        const raidLabel = raid?.label ?? slot.raid.toUpperCase();
        const bookName = raid?.book ?? "books";
        const heldBooks = raid ? player.books[raid.id] : 0;
        return `<article class="need-card"><div class="need-card-heading"><h3>${esc(slot.label)}</h3><span class="target-badge raid">${esc(choiceLabel.raid)}</span></div><p class="source-label">Obtain with either</p><div class="source-options"><span><strong>${esc(raidLabel)} coffer</strong></span><span><strong>${slot.bookCost} ${esc(bookName)}</strong><small>${heldBooks} held</small></span></div></article>`;
      }
      const upgrade = upgradeById[slot.upgrade];
      const raid = raidById[upgrade?.raid];
      const heldItems = upgrade ? player.upgrades[upgrade.id] : 0;
      const heldBooks = raid ? player.books[raid.id] : 0;
      return `<article class="need-card"><div class="need-card-heading"><h3>${esc(slot.label)}</h3><span class="target-badge augmented">${esc(choiceLabel.augmented)}</span></div><p class="source-label">Upgrade with either</p><div class="source-options"><span><strong>1 ${esc(upgrade?.label ?? "upgrade item")}</strong><small>${heldItems} held</small></span><span><strong>${upgrade?.bookCost ?? "?"} ${esc(raid?.book ?? "books")}</strong><small>${heldBooks} held</small></span></div></article>`;
    }).join("");
    return `<details class="party-player" data-overview-player="${esc(name)}" ${openOverviewPlayers.has(name) ? "open" : ""}><summary><div><strong>${esc(name)}</strong><small>${done}/${wanted.length} planned pieces complete · ${remaining.length} remaining</small></div><div class="summary-resources">${resourceChips}</div></summary><div class="progress wide"><i style="width:${wanted.length ? done / wanted.length * 100 : 100}%"></i></div>${remaining.length ? `<div class="need-totals"><span class="need-totals-title">Still needed <small>alternative sources, not additive</small></span><div>${totalBits.join("")}</div></div>` : ""}${needCards ? `<div class="need-grid">${needCards}</div>` : `<p class="all-complete">${wanted.length ? "All planned gear is complete." : "No gear requirements entered."}</p>`}</details>`;
  }).join("");
  return `<section class="stats">${statCards()}</section><section class="panel"><div class="panel-heading"><div><span class="eyebrow">Party status</span><h2>Player summaries</h2></div><button data-action="copy-url">Copy shared URL</button></div><div class="party-summaries">${playerSummaries}</div></section>${runHistory()}`;
}

function setup() {
  const playerSections = config.players.map((name) => {
    const player = state.players[name];
    const rows = config.slots.map((slot) => {
      const target = player.needs[slot.id];
      const complete = player.complete[slot.id];
      const source = target === "raid" ? `${raidById[slot.raid]?.label ?? "M12S"} · ${slot.bookCost} books` : target === "augmented" ? `${upgradeById[slot.upgrade]?.label ?? "Upgrade item"}` : "—";
      const upgrade = target === "augmented" ? upgradeById[slot.upgrade] : null;
      const bookCost = target === "raid" ? slot.bookCost : upgrade?.bookCost;
      const bookRaid = raidById[target === "raid" ? slot.raid : upgrade?.raid];
      const bookAction = bookCost && bookRaid
        ? `Obtain with Books (-${bookCost} ${bookRaid.book})`
        : "Obtain with Books";
      const itemAction = upgrade
        ? `Obtain with ${upgrade.label} (-1 ${upgrade.label})`
        : "";
      const actions = target === "none" ? "" : `<button class="small" data-action="toggle-complete" data-player="${esc(name)}" data-slot="${slot.id}">${complete ? "Undo" : "Obtain with Coffer/Already Have"}</button>${!complete ? `<button class="small ghost" data-action="buy-books" data-player="${esc(name)}" data-slot="${slot.id}">${esc(bookAction)}</button>${itemAction ? `<button class="small ghost" data-action="use-upgrade" data-player="${esc(name)}" data-slot="${slot.id}">${esc(itemAction)}</button>` : ""}` : ""}`;
      return `<tr class="${complete ? "completed" : ""}"><th>${esc(slot.label)}</th><td><select data-field="need" data-player="${esc(name)}" data-slot="${slot.id}">${config.choices.map((choice) => `<option value="${choice.id}" ${choice.id === target ? "selected" : ""}>${esc(choice.label)}</option>`).join("")}</select></td><td><small>${esc(source)}</small></td><td class="obtained-cell"><div class="actions">${actions || "<span class=\"not-applicable\">—</span>"}</div></td></tr>`;
    }).join("");
    return `<details class="player" data-player-panel="${esc(name)}" ${openPlayers.has(name) ? "open" : ""}><summary><strong>${esc(name)}</strong><span>${config.slots.filter((slot) => player.needs[slot.id] !== "none" && !player.complete[slot.id]).length} remaining</span></summary><div class="player-tools"><button class="small" data-action="copy-player" data-player="${esc(name)}">Copy ${esc(name)}'s input</button></div><div class="table-scroll"><table><thead><tr><th>Slot</th><th>Target</th><th>Cost/source</th><th>Obtained</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }).join("");
  return `<section class="panel"><div class="panel-heading"><div><span class="eyebrow">Best-in-slot input</span><h2>Gear plans</h2></div></div>${playerSections}<div class="import-section"><h3>Import a player setup</h3><div class="import-row"><select id="import-target">${config.players.map((name) => `<option>${esc(name)}</option>`).join("")}</select><input id="import-token" placeholder="Paste a player's setup code"><button data-action="import-player">Import into player</button></div></div></section>`;
}

function inventory() {
  const rows = config.players.map((name) => `<tr><th>${esc(name)}</th>${config.raids.map((raid) => countControl(name, "book", raid.id, state.players[name].books[raid.id])).join("")}${config.upgrades.map((upgrade) => countControl(name, "upgrade", upgrade.id, state.players[name].upgrades[upgrade.id])).join("")}</tr>`).join("");
  return `<section class="panel"><div class="panel-heading"><div><span class="eyebrow">Manual corrections</span><h2>Books and upgrade items</h2></div></div><p class="hint">Use Record clear for normal drops. These controls are useful for correcting existing stock or recording purchases.</p><div class="table-scroll"><table><thead><tr><th>Player</th>${config.raids.map((raid) => `<th>${esc(raid.label)} books</th>`).join("")}${config.upgrades.map((upgrade) => `<th>${esc(upgrade.label.replace(/^Thundersteep(?:ed|ing) /, ""))}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function countControl(player, kind, id, count) {
  return `<td><div class="counter"><button aria-label="Remove one" data-action="count" data-delta="-1" data-kind="${kind}" data-id="${id}" data-player="${esc(player)}">−</button><strong>${count}</strong><button aria-label="Add one" data-action="count" data-delta="1" data-kind="${kind}" data-id="${id}" data-player="${esc(player)}">+</button></div></td>`;
}

function record() {
  const forms = config.raids.map((raid) => {
    const attendance = config.players.map((name) => `<label class="check"><input type="checkbox" name="attendance" value="${esc(name)}" checked> ${esc(name)}</label>`).join("");
    const raidNeeds = remainingNeeds(config, state, raid.id);
    const awards = raid.awards.flatMap((award) => Array.from({ length: award.quantityPerClear }, (_, index) => {
      const needers = new Set(raidNeeds
        .filter((need) => award.kind === "gear" ? need.reward === award.id : need.reward === award.upgrade)
        .map((need) => need.player));
      const rollGuide = `<div class="roll-guide" aria-label="Who should roll for ${esc(award.label)}"><span class="roll-guide-title">Who should roll?</span><div class="roll-statuses">${config.players.map((name) => `<span class="roll-status ${needers.has(name) ? "needs" : "does-not-need"}"><strong>${esc(name)}</strong><small>${needers.has(name) ? "Needs" : "Doesn't need"}</small></span>`).join("")}</div></div>`;
      if (award.kind === "gear") {
        const options = raidNeeds.filter((need) => need.target === "raid" && need.reward === award.id).map((need) => `<option value="${esc(need.player)}|${need.slot.id}">${esc(need.player)} — ${esc(need.slot.label)}</option>`).join("");
        return `<div class="award-entry" data-award-id="${award.id}"><label>${esc(award.label)}${award.quantityPerClear > 1 ? ` ${index + 1}` : ""}<select name="award:${award.id}:${index}" data-award-kind="gear"><option value="">No tracked winner</option>${options}</select></label>${rollGuide}</div>`;
      }
      return `<div class="award-entry" data-award-id="${award.id}"><label>${esc(award.label)}${award.quantityPerClear > 1 ? ` ${index + 1}` : ""}<select name="award:${award.id}:${index}" data-award-kind="upgrade" data-upgrade="${award.upgrade}"><option value="">No tracked winner</option>${config.players.map((name) => `<option>${esc(name)}</option>`).join("")}</select></label>${rollGuide}</div>`;
    })).join("");
    return `<form class="run-form" data-raid="${raid.id}"><div class="run-title"><div><span class="eyebrow">${esc(raid.label)}</span><h2>${esc(raid.name)}</h2></div><strong>${runsRemaining(config, state, raid.id)} left</strong></div><fieldset><legend>Who cleared and receives their personal book?</legend><div class="checks">${attendance}</div></fieldset><div class="award-grid">${awards || "<p>No rolled rewards configured.</p>"}</div><button type="submit">Record clear</button></form>`;
  }).join("");
  return `<section class="run-grid">${forms}</section>`;
}

function runHistory() {
  if (!state.runs.length) return "";
  return `<section class="panel"><div class="panel-heading"><div><span class="eyebrow">Audit trail</span><h2>Recent clears</h2></div></div><ol class="history">${[...state.runs].reverse().slice(0, 10).map((run) => `<li><strong>${esc(raidById[run.raid]?.label ?? run.raid)}</strong><span>${esc(run.summary ?? "Clear recorded")}</span><time>${esc(run.at ?? "")}</time></li>`).join("")}</ol></section>`;
}

function gearSetupMessage() {
  return `${gearSetupPlayer}:\n\`\`\`\np1.${encode(gearSetupDraft)}\n\`\`\``;
}

function gearSetupModal() {
  if (location.hash !== "#gear-setup") return "";
  const slotCards = config.slots.map((slot) => {
    const target = gearSetupDraft.needs[slot.id];
    return `<div class="setup-slot-card"><strong>${esc(slot.label)}</strong><select aria-label="${esc(slot.label)} target" data-setup-need="${slot.id}">${config.choices.map((choice) => `<option value="${choice.id}" ${target === choice.id ? "selected" : ""}>${esc(choice.label)}</option>`).join("")}</select><label class="setup-owned"><input type="checkbox" data-setup-complete="${slot.id}" ${gearSetupDraft.complete[slot.id] ? "checked" : ""} ${target === "none" ? "disabled" : ""}> <span>I already have this piece</span></label></div>`;
  }).join("");
  const bookInputs = config.raids.map((raid) => `<label><span>${esc(raid.label)} books</span><input type="number" min="0" max="999" inputmode="numeric" value="${gearSetupDraft.books[raid.id]}" data-setup-book="${raid.id}"></label>`).join("");
  const upgradeInputs = config.upgrades.map((upgrade) => `<label><span>${esc(upgrade.label)}</span><input type="number" min="0" max="999" inputmode="numeric" value="${gearSetupDraft.upgrades[upgrade.id]}" data-setup-upgrade="${upgrade.id}"></label>`).join("");
  return `<div class="modal-backdrop"><section class="setup-modal" role="dialog" aria-modal="true" aria-labelledby="gear-setup-title"><div class="setup-modal-heading"><div><span class="eyebrow">Personal setup</span><h2 id="gear-setup-title">Prepare your gear plan</h2><p>Pick yourself, enter what you need and what you already hold, then send the generated message to Discord.</p></div><button class="modal-close" data-action="gear-setup-close" aria-label="Close gear setup">×</button></div><label class="setup-player-picker"><span>Who are you?</span><select id="gear-setup-player">${config.players.map((name) => `<option ${name === gearSetupPlayer ? "selected" : ""}>${esc(name)}</option>`).join("")}</select></label><h3>Gear targets</h3><div class="setup-slot-grid">${slotCards}</div><h3>Books and upgrade items already held</h3><div class="setup-inventory-grid">${bookInputs}${upgradeInputs}</div><div class="setup-output"><label for="gear-setup-code">Discord message</label><textarea id="gear-setup-code" readonly rows="5">${esc(gearSetupMessage())}</textarea><button data-action="copy-gear-setup">Copy Discord message</button><p>Paste this directly into Discord. The player merging everyone’s plans can use Discord’s code-block copy button and import the resulting <code>p1.…</code> code.</p></div></section></div>`;
}

function refreshGearSetupMessage() {
  const output = document.querySelector("#gear-setup-code");
  if (output) output.value = gearSetupMessage();
}

function render() {
  const renderedPlayerPanels = [...app.querySelectorAll("[data-player-panel]")];
  if (renderedPlayerPanels.length) {
    openPlayers = new Set(renderedPlayerPanels.filter((panel) => panel.open).map((panel) => panel.dataset.playerPanel));
  }
  const renderedOverviewPlayers = [...app.querySelectorAll("[data-overview-player]")];
  if (renderedOverviewPlayers.length) {
    openOverviewPlayers = new Set(renderedOverviewPlayers.filter((panel) => panel.open).map((panel) => panel.dataset.overviewPlayer));
  }
  const content = ({ overview, setup, inventory, record: record })[activeView]();
  app.innerHTML = `<header><div><span class="kicker">DND FC · Gear tracker</span><h1>${esc(config.title)}</h1><p>${esc(config.subtitle ?? "")}</p></div><a href="${esc(config.sourceUrl ?? "#")}" target="_blank" rel="noreferrer">Loot table ↗</a></header><nav>${[["overview", "Overview"], ["setup", "Gear plans"], ["inventory", "Inventory"], ["record", "Record clear"]].map(([id, label]) => `<button class="${activeView === id ? "active" : ""}" data-view="${id}">${label}</button>`).join("")}</nav><main>${content}</main>${gearSetupModal()}<div id="toast" role="status"></div>`;
}

app.addEventListener("click", async (event) => {
  const viewButton = event.target.closest("[data-view]");
  if (viewButton) { activeView = viewButton.dataset.view; render(); return; }
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const { action, player, slot, kind, id } = button.dataset;
  if (action === "copy-url") { save(); await copyText(location.href, "Shared URL copied"); return; }
  if (action === "copy-gear-setup") { await copyText(gearSetupMessage(), "Discord message copied"); return; }
  if (action === "gear-setup-close") {
    history.replaceState(null, "", location.pathname + location.search);
    render();
    return;
  }
  if (action === "toggle-complete") state.players[player].complete[slot] = !state.players[player].complete[slot];
  if (action === "buy-books" && !acquireWithBooks(config, state, player, slot)) { notify("Not enough books"); return; }
  if (action === "use-upgrade" && !acquireWithUpgrade(config, state, player, slot)) { notify("That upgrade item is not in inventory"); return; }
  if (action === "count") {
    const bucket = kind === "book" ? state.players[player].books : state.players[player].upgrades;
    bucket[id] = safeCount(bucket[id] + Number(button.dataset.delta));
  }
  if (action === "copy-player") {
    await copyText(`p1.${encode(state.players[player])}`, `${player}'s setup copied`);
    return;
  }
  if (action === "import-player") {
    const target = document.querySelector("#import-target").value;
    const token = document.querySelector("#import-token").value.trim();
    try {
      if (!token.startsWith("p1.")) throw new Error();
      state.players[target] = normalizeState(config, { v: 1, players: { [target]: decode(token.slice(3)) } }).players[target];
    } catch { notify("That player setup code is invalid"); return; }
  }
  save(); render();
  if (action === "import-player") notify("Player setup imported");
});

app.addEventListener("change", (event) => {
  if (event.target.id === "gear-setup-player") {
    gearSetupPlayer = event.target.value;
    refreshGearSetupMessage();
    return;
  }
  if (event.target.matches("[data-setup-need]")) {
    const slotId = event.target.dataset.setupNeed;
    gearSetupDraft.needs[slotId] = event.target.value;
    gearSetupDraft.complete[slotId] = false;
    const completeInput = event.target.closest(".setup-slot-card")?.querySelector("[data-setup-complete]");
    if (completeInput) {
      completeInput.checked = false;
      completeInput.disabled = event.target.value === "none";
    }
    refreshGearSetupMessage();
    return;
  }
  if (event.target.matches("[data-setup-complete]")) {
    gearSetupDraft.complete[event.target.dataset.setupComplete] = event.target.checked;
    refreshGearSetupMessage();
    return;
  }
  const select = event.target.closest('[data-field="need"]');
  if (!select) return;
  const player = state.players[select.dataset.player];
  player.needs[select.dataset.slot] = select.value;
  player.complete[select.dataset.slot] = false;
  save(); render();
});

app.addEventListener("input", (event) => {
  if (event.target.matches("[data-setup-book]")) {
    gearSetupDraft.books[event.target.dataset.setupBook] = safeCount(event.target.value);
    refreshGearSetupMessage();
  }
  if (event.target.matches("[data-setup-upgrade]")) {
    gearSetupDraft.upgrades[event.target.dataset.setupUpgrade] = safeCount(event.target.value);
    refreshGearSetupMessage();
  }
});

app.addEventListener("submit", (event) => {
  const form = event.target.closest(".run-form");
  if (!form) return;
  event.preventDefault();
  const raidId = form.dataset.raid;
  const attendees = [...form.querySelectorAll('[name="attendance"]:checked')].map((input) => input.value);
  attendees.forEach((name) => state.players[name].books[raidId] += 1);
  const notes = [`${attendees.length} books`];
  for (const select of form.querySelectorAll("select[data-award-kind]")) {
    if (!select.value) continue;
    if (select.dataset.awardKind === "gear") {
      const [name, slotId] = select.value.split("|");
      state.players[name].complete[slotId] = true;
      notes.push(`${name}: ${slotById[slotId].label}`);
    } else {
      state.players[select.value].upgrades[select.dataset.upgrade] += 1;
      notes.push(`${select.value}: ${upgradeById[select.dataset.upgrade].label.replace(/^Thundersteep(?:ed|ing) /, "")}`);
    }
  }
  state.runs.push({ raid: raidId, at: new Date().toLocaleDateString(), summary: notes.join(" · ") });
  save(); render(); notify(`${raidById[raidId].label} clear recorded`);
});

window.addEventListener("hashchange", () => { state = readState(); render(); });
render();
</script>
